name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - run: go vet ./...
      # staticcheck caught two shadowed-err bugs (a nil-response panic, an unchecked WebAuthn error); keep it clean.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - run: go test ./...
      - run: make server agents cli
      - name: Cross-build Windows CLI
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/aven
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/aven
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/aven-server

  # The race detector found a real data race (PITR restore status) that the plain run missed.
  # It is about ten times slower, so it runs as its own job next to the others.
  go-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # internal/api alone takes about ten minutes under -race, past go test's default timeout.
      - run: go test -race -timeout 30m ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test sdk/index.test.ts

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - run: docker build -t aven-website:ci .

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=ci -t aven-server:ci .
      - run: docker run --rm aven-server:ci sh -c 'aven-server selfhost run-args --image aven-server:ci && railpack --version && docker buildx version && aven --version'
